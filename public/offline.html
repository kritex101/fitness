<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17251F" />
    <title>FitPilot — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #F4F7F3; color: #17251F; font-family: system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border-radius: 28px; background: #fff; text-align: center; }
      .mark { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 24px; border-radius: 17px; background: #A8E76F; font-weight: 800; font-size: 24px; }
      h1 { margin: 0; font-size: 28px; letter-spacing: -0.04em; }
      p { color: #657169; line-height: 1.6; }
      a { display: inline-flex; margin-top: 8px; padding: 13px 18px; border-radius: 999px; background: #17251F; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">F</div>
      <h1>You&apos;re offline</h1>
      <p>FitPilot can&apos;t reach the internet right now. Reconnect and try again to load your training dashboard.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
